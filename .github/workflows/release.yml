name: Stage npm release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin staged-publishing npm CLI
        run: npm install --global npm@11.16.0
      - name: Verify immutable release tag and unpublished version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${EXPECTED_TAG}"
          test "$(git cat-file -t "${EXPECTED_TAG}")" = "tag"
          test "$(git rev-parse "${EXPECTED_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(npm --version)" = "11.16.0"

          npm view "${PACKAGE_NAME}" name >/dev/null
          if VERSION_OUTPUT=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>&1); then
            echo "Refusing to reuse published npm version ${PACKAGE_NAME}@${PACKAGE_VERSION}" >&2
            echo "${VERSION_OUTPUT}" >&2
            exit 1
          fi
          if ! grep -Eq 'E404|No match found for version' <<<"${VERSION_OUTPUT}"; then
            echo "npm version lookup failed for a reason other than an absent version" >&2
            echo "${VERSION_OUTPUT}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build
      - name: Run current local community-package scanner
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @n8n/scan-community-package@beta
          SCANNER_ROOT=$(npm root --global)
          SCANNER_ROOT="${SCANNER_ROOT}" node --input-type=module -e '
            const scannerUrl = new URL(
              `file://${process.env.SCANNER_ROOT}/@n8n/scan-community-package/scanner/scanner.mjs`,
            );
            const { analyzePackage, SOURCE_FILE_PATTERNS } = await import(scannerUrl);
            const result = await analyzePackage(process.cwd(), SOURCE_FILE_PATTERNS);
            console.log(JSON.stringify(result));
            if (!result.passed) process.exitCode = 1;
          '
      - run: npm pack --dry-run
      - name: Create and inspect exact release tarball
        shell: bash
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TEST_COUNT: '263'
        run: |
          set -euo pipefail
          RELEASE_NODE_VERSION=$(node --version) \
          RELEASE_NPM_VERSION=$(npm --version) \
          RELEASE_PNPM_VERSION=$(pnpm --version) \
            pnpm run test:package -- \
              --output-directory release-artifacts \
              --manifest release-manifest.json
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-manifest.json
          if-no-files-found: error
      - name: Stage exact tarball under next
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find release-artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          npm stage publish "${TARBALLS[0]}" --provenance --access public --tag next
