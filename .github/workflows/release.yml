name: Release dry run

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and retain the exact 0.1.0 package candidate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate release artifact
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - name: Enforce the non-publishing invocation
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$DRY_RUN" = "true"
          test "$RELEASE_REF" = "refs/heads/main"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Pin the validated npm CLI
        run: npm install --global npm@11.16.0

      - name: Record toolchain
        run: |
          node --version
          npm --version
          pnpm --version
          echo "RELEASE_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "RELEASE_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
          echo "RELEASE_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static validation
        run: |
          pnpm run validate
          pnpm run typecheck
          pnpm run lint
          pnpm run format:check

      - name: Run the full test suite
        run: |
          pnpm exec vitest run --reporter=json --outputFile=/tmp/vitest-results.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/vitest-results.json')); if (r.numFailedTests || r.numFailedTestSuites || !r.success) process.exit(1); fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TEST_COUNT=' + r.numTotalTests + '\\n'); console.log(r.numTotalTests + ' tests passed');"

      - name: Build and check the npm preview
        run: |
          pnpm run build
          npm pack --dry-run

      - name: Validate and retain one exact tarball
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_COMMIT"
          test -z "$(git tag --list v0.1.0)"
          mkdir release-artifacts
          node scripts/package-regression.mjs \
            --output-directory release-artifacts \
            --manifest release-artifacts/release-manifest.json
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify retained artifact and source tree
        env:
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const m=JSON.parse(fs.readFileSync('release-artifacts/release-manifest.json')); const b=fs.readFileSync('release-artifacts/' + m.tarballName); if (m.sourceCommit !== process.env.RELEASE_SOURCE_COMMIT || m.intendedTag !== 'v0.1.0' || crypto.createHash('sha256').update(b).digest('hex') !== m.sha256) process.exit(1); console.log(JSON.stringify(m, null, 2));"
          test -z "$(git tag --list v0.1.0)"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload validated dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-dry-run-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
